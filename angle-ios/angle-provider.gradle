
description = 'ANGLE source preparation for libJGLIOS.'

ext {
    angleIosVendorDir = layout.buildDirectory.dir('libjglios/angle-ios').get()
    angleIosScriptDir = layout.projectDirectory.dir('scripts')
    angleIosPatchDir = layout.projectDirectory.dir('patches')
    angleIosUrl = rootProject.findProperty('angleIosUrl') ?: 'https://chromium.googlesource.com/angle/angle'
    angleIosBuildType = rootProject.findProperty('angleIosBuildType') ?: 'Release'
    angleIosMetalProfile = (rootProject.findProperty('angleIosMetalProfile') ?: 'gles30').toString()
    angleBuilderUrl = rootProject.findProperty('angleBuilderUrl') ?: 'https://github.com/NostrGameEngine/angle-builder.git'
    angleBuilderRevision = rootProject.findProperty('angleBuilderRevision').toString()
    angleBuilderDir = layout.buildDirectory.dir('angle/builder').get()
    angleUpstreamRevisionFile = layout.buildDirectory.file('angle/upstream-commit.txt')
    angleUpstreamRevision = providers.fileContents(angleUpstreamRevisionFile).asText.map { it.trim() }
    angleIosBuildJobs = (rootProject.findProperty('angleIosBuildJobs') ?: '2').toString()
    angleIosSimulatorArchitectures = (rootProject.findProperty('angleIosSimulatorArchitectures') ?: 'arm64,x86_64').toString()
    angleIosDeploymentTarget = (rootProject.findProperty('libJGLIOSBuildForIosVersion') ?: '12.0').toString()
    angleIosSourceDir = layout.buildDirectory.dir("angle/source-${angleIosMetalProfile}").get()
    angleIosCheckoutMarker = layout.buildDirectory.file("angle/source-${angleIosMetalProfile}/.libjglios-checkout").get()
}

if (!(angleIosMetalProfile in ['gles30', 'gles31'])) {
    throw new GradleException('angleIosMetalProfile must be gles30 or gles31')
}
if (!(angleBuilderRevision ==~ /[0-9a-f]{40}/)) {
    throw new GradleException('angleBuilderRevision must pin a full commit SHA')
}
if (rootProject.hasProperty('angleIosRevision')) {
    throw new GradleException('angleIosRevision is derived from ANGLE Builder; remove it and configure only angleBuilderRevision')
}
if (angleIosMetalProfile == 'gles31' && angleIosDeploymentTarget.tokenize('.')[0].toInteger() < 18) {
    angleIosDeploymentTarget = '18.0'
}

def libJGLIOSExecCapture = { List<String> argsList, File workingDir = project.projectDir ->
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def process = new ProcessBuilder(argsList)
            .directory(workingDir)
            .redirectErrorStream(false)
            .start()
    def errorReader = Thread.start { process.errorStream.transferTo(stderr) }
    process.inputStream.transferTo(stdout)
    def exitValue = process.waitFor()
    errorReader.join()
    [
        exitValue: exitValue,
        stdout: stdout.toString('UTF-8'),
        stderr: stderr.toString('UTF-8')
    ]
}

def libJGLIOSRun = { List<String> argsList, File workingDir = project.projectDir ->
    println argsList.join(' ')
    def process = new ProcessBuilder(argsList).directory(workingDir).redirectErrorStream(true).start()
    process.inputStream.transferTo(System.out)
    def exitValue = process.waitFor()
    if (exitValue != 0) {
        throw new GradleException("Command failed (${exitValue}): ${argsList.join(' ')}")
    }
}

def libJGLIOSNormalizeANGLE = { File extracted, File vendor ->
    def eglFramework = new File(extracted, 'libEGL.xcframework/ios-arm64/libEGL.framework')
    def glesFramework = new File(extracted, 'libGLESv2.xcframework/ios-arm64/libGLESv2.framework')
    def featureSupportFramework = new File(extracted, 'libfeature_support.xcframework/ios-arm64/libfeature_support.framework')

    [eglFramework, glesFramework, featureSupportFramework].each { required ->
        if (!required.exists()) {
            throw new GradleException("ANGLE extraction did not contain expected iOS arm64 framework: ${required}")
        }
    }

    delete vendor
    copy {
        from new File(eglFramework, 'Headers')
        into new File(vendor, 'include')
    }
    copy {
        from new File(glesFramework, 'Headers')
        into new File(vendor, 'include')
    }
    copy {
        from new File(featureSupportFramework, 'Headers')
        into new File(vendor, 'include')
    }
    def xcframeworks = (extracted.listFiles()?.findAll { it.name.endsWith('.xcframework') } ?: [])
    if (xcframeworks.isEmpty()) {
        throw new GradleException("ANGLE build did not produce any xcframeworks under ${extracted}")
    }
    xcframeworks.each { framework ->
        def destination = new File(vendor, "xcframeworks/${framework.name}")
        copy {
            from framework
            into destination
        }
    }

    copy {
        from new File(extracted, 'ANGLE_IOS_BUILD_MANIFEST.json')
        into vendor
    }
    println "Normalized headers into ${new File(vendor, 'include')}"
    println "Normalized xcframeworks into ${new File(vendor, 'xcframeworks')}"
}

tasks.register('checkoutANGLEBuilder') {
    group = 'libJGLIOS setup'
    description = 'Checks out the pinned shared ANGLE patch implementation.'
    inputs.property('angleBuilderRevision', angleBuilderRevision)
    inputs.property('angleBuilderUrl', angleBuilderUrl)
    outputs.file { new File(angleBuilderDir.asFile.parentFile, 'builder-checkout.txt') }
    outputs.file(angleUpstreamRevisionFile)
    doLast {
        def builder = angleBuilderDir.asFile
        if (!new File(builder, '.git').exists()) {
            builder.mkdirs()
            libJGLIOSRun(['git', 'init', '-q'], builder)
            libJGLIOSRun(['git', 'remote', 'add', 'origin', angleBuilderUrl], builder)
        } else if (libJGLIOSExecCapture(['git', 'status', '--porcelain'], builder).stdout.trim()) {
            throw new GradleException("Refusing to modify a dirty ANGLE Builder checkout: ${builder}")
        }
        if (libJGLIOSExecCapture(['git', 'cat-file', '-e', angleBuilderRevision + '^{commit}'], builder).exitValue != 0) {
            libJGLIOSRun(['git', 'fetch', '--depth', '1', angleBuilderUrl, angleBuilderRevision], builder)
        }
        libJGLIOSRun(['git', 'checkout', '--detach', angleBuilderRevision], builder)
        def upstreamRevision = new File(builder, 'ANGLE_COMMIT').text.trim()
        if (!(upstreamRevision ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('The pinned ANGLE Builder ANGLE_COMMIT must contain a full commit SHA')
        }
        angleUpstreamRevisionFile.get().asFile.text = upstreamRevision + System.lineSeparator()
        new File(builder.parentFile, 'builder-checkout.txt').text = angleBuilderRevision + System.lineSeparator()
    }
}

tasks.register('checkoutANGLESource') {
    group = 'libJGLIOS setup'
    dependsOn 'checkoutANGLEBuilder'
    description = 'Copies the ANGLE build scripts and checks out the upstream revision pinned by ANGLE Builder.'
    inputs.files(fileTree(angleIosScriptDir) { include '*.sh', '*.py' })
    inputs.file(layout.projectDirectory.file('patch-series.json'))
    inputs.dir(angleIosPatchDir)
    inputs.property('angleUpstreamRevision', angleUpstreamRevision)
    outputs.file(angleIosCheckoutMarker)
    doLast {
        def upstreamRevision = angleUpstreamRevision.get()
        def source = angleIosSourceDir.asFile
        def scriptDir = angleIosScriptDir.asFile
        def patchDir = angleIosPatchDir.asFile
        if (!new File(scriptDir, 'setup-angle.sh').exists() || !new File(scriptDir, 'build-angle.sh').exists()) {
            throw new GradleException("ANGLE build scripts are missing or incomplete: ${scriptDir}")
        }
        if ((patchDir.listFiles()?.findAll { it.name.endsWith('.patch') } ?: []).isEmpty()) {
            throw new GradleException("No ANGLE patches found in ${patchDir}")
        }

        source.mkdirs()
        copy {
            from scriptDir
            include '*.sh', '*.py'
            into source
        }
        copy {
            from layout.projectDirectory.file('patch-series.json')
            into source
        }
        delete(source.listFiles()?.findAll { it.name.endsWith('.patch') } ?: [])
        copy {
            from patchDir
            include '*.patch'
            into source
        }
        libJGLIOSRun(['chmod', '+x', 'setup-angle.sh', 'build-angle.sh'], source)

        def depotTools = new File(source, 'depot_tools')
        if (!new File(depotTools, '.git').exists()) {
            libJGLIOSRun(['git', 'clone', '--depth', '1', 'https://chromium.googlesource.com/chromium/tools/depot_tools.git', depotTools.absolutePath])
        } else {
            libJGLIOSRun(['git', '-C', depotTools.absolutePath, 'fetch', '--depth', '1', 'origin', 'main'])
            libJGLIOSRun(['git', '-C', depotTools.absolutePath, 'checkout', 'FETCH_HEAD'])
        }

        def angle = new File(source, 'angle')
        if (!new File(angle, '.git').exists()) {
            libJGLIOSRun(['git', 'clone', '--depth', '1', angleIosUrl, angle.absolutePath])
        }
        if (libJGLIOSExecCapture(['git', 'cat-file', '-e', upstreamRevision + '^{commit}'], angle).exitValue != 0) {
            libJGLIOSRun(['git', '-C', angle.absolutePath, 'fetch', '--depth', '1', 'origin', upstreamRevision])
        }
        libJGLIOSRun(['git', '-C', angle.absolutePath, 'checkout', '--detach', upstreamRevision])


        def resolvedAngle = libJGLIOSExecCapture(['git', '-C', angle.absolutePath, 'rev-parse', 'HEAD'])
        if (resolvedAngle.exitValue != 0) {
            throw new GradleException("Unable to resolve ANGLE revision: ${resolvedAngle.stderr}")
        }
        println "ANGLE source: ${source}"
        println "ANGLE revision: ${resolvedAngle.stdout.trim()}"
        angleIosCheckoutMarker.asFile.text = resolvedAngle.stdout.trim() + System.lineSeparator()
    }
}

tasks.register('buildANGLE') {
    group = 'libJGLIOS setup'
    description = 'Builds libEGL, libGLESv2, and libfeature_support xcframeworks from source.'
    dependsOn 'checkoutANGLESource'
    inputs.files(fileTree(angleIosScriptDir) { include '*.sh', '*.py' })
    inputs.file(layout.projectDirectory.file('patch-series.json'))
    inputs.dir(angleIosPatchDir)
    inputs.property('angleIosBuildType', angleIosBuildType)
    inputs.property('angleIosMetalProfile', angleIosMetalProfile)
    inputs.property('angleBuilderRevision', angleBuilderRevision)
    inputs.property('angleIosBuildJobs', angleIosBuildJobs)
    inputs.property('angleIosSimulatorArchitectures', angleIosSimulatorArchitectures)
    inputs.property('angleIosDeploymentTarget', angleIosDeploymentTarget)
    inputs.property('angleUpstreamRevision', angleUpstreamRevision)
    outputs.dir { new File(angleIosSourceDir.asFile, 'Frameworks') }
    doLast {
        def source = angleIosSourceDir.asFile
        libJGLIOSRun(['./setup-angle.sh', angleIosDeploymentTarget, angleIosMetalProfile, angleBuilderDir.asFile.absolutePath, angleBuilderRevision, angleUpstreamRevision.get(), angleIosBuildType], source)
        libJGLIOSRun(['./build-angle.sh', angleIosBuildType, angleIosMetalProfile, angleIosBuildJobs, angleIosSimulatorArchitectures], source)
        println "Built source ANGLE artifacts under ${new File(source, 'Frameworks')}"
    }
}

tasks.register('prepareANGLE') {
    group = 'libJGLIOS setup'
    description = 'Builds ANGLE from source and normalizes it for libJGLIOS.'
    dependsOn 'buildANGLE'
    inputs.file { new File(angleIosSourceDir.asFile, 'Frameworks/ANGLE_IOS_BUILD_MANIFEST.json') }
    inputs.property('angleIosMetalProfile', angleIosMetalProfile)
    outputs.dir(angleIosVendorDir)
    doLast {
        def extracted = new File(angleIosSourceDir.asFile, 'Frameworks')
        def vendor = angleIosVendorDir.asFile
        println "Using source-built ANGLE from ${extracted}"
        libJGLIOSNormalizeANGLE(extracted, vendor)
    }
}
