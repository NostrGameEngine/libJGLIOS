name: Build and Publish

on:
  push:
    branches:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-ios:
    name: Test iOS build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build sample-ios debug app
        run: ./gradlew --no-daemon :sample-ios:buildIosSimulatorApp

  test-angle-gles31:
    name: Build ANGLE GLES 3.1 profile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check automatic upstream revision selection
        run: python3 angle-ios/tests/test-angle-provider.py
      - name: Build device and arm64 simulator frameworks
        run: ./gradlew --no-daemon :angle-ios:prepareANGLE -PangleIosMetalProfile=gles31 -PangleIosSimulatorArchitectures=arm64 -PangleIosBuildJobs=2
      - name: Check shared and iOS patch integration
        env:
          ANGLE_DIR: ${{ github.workspace }}/angle-ios/build/angle/source-gles31/angle
          ANGLE_BUILDER_DIR: ${{ github.workspace }}/angle-ios/build/angle/builder
        run: python3 angle-ios/tests/test-setup-angle.py

  build:
    name: Build
    runs-on: macos-15
    needs: [test-build-ios, test-angle-gles31]
    if: github.event_name != 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: ./gradlew --no-daemon clean build publishToMavenLocal

      - name: Publish snapshots
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew --no-daemon publishAllPublicationsToSonatypeSnapshotsRepository

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libjglios-build-${{ github.run_id }}
          if-no-files-found: error
          path: |
            **/build/libs/*
            **/build/publications/**
            !**/build/tmp/**
            !**/.gradle/**

  publish-release:
    name: Publish Release
    runs-on: macos-15
    needs: test-build-ios
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish release
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon clean build publishToSonatype closeAndReleaseSonatypeStagingRepository -PlibJGLIOSVersion="${VERSION}"
