plugins {
    id 'java-library'
}

description = 'iOS-only Graal sample for libJGLIOS. The simulator app is built through the libJGLIOS plugin task script.'

tasks.withType(JavaCompile).configureEach {
    // The pinned Native Image runtime uses Java 21, even when Gradle runs on a newer JDK.
    options.release = 21
}

def libJGLIOSSampleBackend = (findProperty('libJGLIOSSampleBackend') ?: 'angle').toString().trim().toLowerCase(Locale.ROOT)

dependencies {
    implementation project(':sdl3-ios')
    implementation project(':openal-ios')
    if (libJGLIOSSampleBackend == 'legacy') {
        implementation project(':legacy-core-ios')
        implementation project(':legacy-gles-ios')
    } else if (libJGLIOSSampleBackend == 'angle') {
        implementation project(':core-ios')
        implementation project(':angle-ios')
        implementation project(':gles-ios')
    } else {
        throw new GradleException("Unsupported libJGLIOSSampleBackend: ${libJGLIOSSampleBackend}. Use 'angle' or 'legacy'.")
    }
}

ext.set('iOS.mainClass', 'org.ngengine.libjglios.sample.IosGraalEntrypoints')
ext.set('iOS.bundleId', findProperty('iOS.bundleId') ?: findProperty('ios.bundleId') ?: (libJGLIOSSampleBackend == 'legacy' ? 'org.ngengine.libjglios.sample.legacy' : 'org.ngengine.libjglios.sample'))
ext.set('iOS.appName', findProperty('iOS.appName') ?: findProperty('ios.appName') ?: (libJGLIOSSampleBackend == 'legacy' ? 'IOSLegacyGlesGears' : 'IOSGlesGears'))

apply from: rootProject.file('libjglios-gradle-plugin/src/main/resources/org/ngengine/libjglios/gradle/ios-tasks.gradle')

// The verification code is carried only by this unpublished sample.
apply from: rootProject.file('gradle/libjglios/ios-framework.gradle')
if (libJGLIOSSampleBackend == 'angle') {
    def angleProject = project(':angle-ios')
    libJGLIOSStaticIosFramework(
        frameworkName: 'libJGLIOSSampleVerification',
        taskName: 'buildSampleVerificationXcframework',
        dependsOn: [':angle-ios:prepareANGLEIosFrameworks'],
        sources: [
            file('src/main/native/angle-profile-verification.mm'),
            file('src/main/native/angle-culling-verification.mm'),
            file('src/main/native/gles31-verification-jni.mm')
        ],
        includes: [
            { new File(angleProject.angleBuilderDir.asFile, 'tests') },
            { new File(angleProject.angleIosVendorDir.asFile, 'include') }
        ],
        metadata: [systemFrameworks: ['Foundation', 'Metal']]
    )
    tasks.named('buildSampleVerificationXcframework') {
        inputs.property('angleBuilderRevision', angleProject.angleBuilderRevision)
        inputs.property('angleIosMetalProfile', angleProject.angleIosMetalProfile)
    }
}
